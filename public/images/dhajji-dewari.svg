  <line x1="250" y1="110" x2="350" y2="190" stroke="#b45309" stroke-width="3" />
  <line x1="350" y1="110" x2="250" y2="190" stroke="#b45309" stroke-width="3" />

  <line x1="50" y1="190" x2="150" y2="270" stroke="#b45309" stroke-width="3" />
