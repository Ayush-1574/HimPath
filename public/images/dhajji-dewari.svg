  <line x1="250" y1="190" x2="350" y2="270" stroke="#b45309" stroke-width="3" />
  <line x1="350" y1="190" x2="250" y2="270" stroke="#b45309" stroke-width="3" />

  <rect x="70" y="50" width="60" height="40" fill="#e5e7eb" opacity="0.6" />
  <rect x="170" y="50" width="60" height="40" fill="#e5e7eb" opacity="0.6" />
  <rect x="270" y="50" width="60" height="40" fill="#e5e7eb" opacity="0.6" />
  <text x="200" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">DHAJJI-DEWARI TIMBER BRACED DIAGONAL MESH</text>
