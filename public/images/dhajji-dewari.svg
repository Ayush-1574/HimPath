  <rect x="50" y="30" width="300" height="240" fill="#fef3c7" stroke="#78350f" stroke-width="6" />
  <!-- Vertical Posts -->
  <line x1="150" y1="30" x2="150" y2="270" stroke="#78350f" stroke-width="5" />
  <line x1="250" y1="30" x2="250" y2="270" stroke="#78350f" stroke-width="5" />
  <!-- Horizontal Runners -->
  <line x1="50" y1="110" x2="350" y2="110" stroke="#78350f" stroke-width="5" />
  <line x1="50" y1="190" x2="350" y2="190" stroke="#78350f" stroke-width="5" />
  <!-- Diagonal Braces -->
  <line x1="50" y1="30" x2="150" y2="110" stroke="#b45309" stroke-width="3" />
