<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f8fafc" rx="8" />
  <!-- Thathara Multi-tier Sloped Architecture -->
  <polygon points="60,250 340,250 300,120 100,120" fill="#cbd5e1" stroke="#334155" stroke-width="2" />
  <!-- Cantilever Balcony Tier -->
  <rect x="70" y="110" width="260" height="50" fill="#e2e8f0" stroke="#1e293b" stroke-width="2" />
  <!-- Timber Posts -->
  <line x1="100" y1="110" x2="100" y2="160" stroke="#78350f" stroke-width="4" />
  <line x1="160" y1="110" x2="160" y2="160" stroke="#78350f" stroke-width="4" />
  <line x1="240" y1="110" x2="240" y2="160" stroke="#78350f" stroke-width="4" />
  <line x1="300" y1="110" x2="300" y2="160" stroke="#78350f" stroke-width="4" />
  <!-- Sloping Slate Roof -->
  <polygon points="40,110 200,40 360,110 330,120 200,60 70,120" fill="#475569" stroke="#0f172a" stroke-width="2" />
  <text x="200" y="280" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">THATHARA SLOPED COMPOSITE MOUNTAIN SYSTEM</text>
</svg>
