<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f8fafc" rx="8" />
  <!-- Rammed Earth Layered Wall Section -->
  <rect x="70" y="40" width="260" height="200" fill="#d97706" stroke="#78350f" stroke-width="3" rx="4" />
  <!-- Strata / Layers -->
  <rect x="70" y="40" width="260" height="40" fill="#b45309" opacity="0.8" />
  <rect x="70" y="80" width="260" height="40" fill="#d97706" opacity="0.9" />
  <rect x="70" y="120" width="260" height="40" fill="#92400e" opacity="0.85" />
  <rect x="70" y="160" width="260" height="40" fill="#b45309" opacity="0.9" />
  <rect x="70" y="200" width="260" height="40" fill="#78350f" opacity="0.95" />
  
  <!-- Formwork Lines -->
  <line x1="70" y1="80" x2="330" y2="80" stroke="#fef3c7" stroke-width="1.5" stroke-dasharray="4 2" />
  <line x1="70" y1="120" x2="330" y2="120" stroke="#fef3c7" stroke-width="1.5" stroke-dasharray="4 2" />
  <line x1="70" y1="160" x2="330" y2="160" stroke="#fef3c7" stroke-width="1.5" stroke-dasharray="4 2" />
  <line x1="70" y1="200" x2="330" y2="200" stroke="#fef3c7" stroke-width="1.5" stroke-dasharray="4 2" />

  <text x="200" y="275" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">HIGH THERMAL-MASS RAMMED EARTH COMPACTED STRATA</text>
</svg>
